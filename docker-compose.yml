---
services:
  caddy:
    image: caddy:2.9-alpine
    container_name: portal-caddy
    restart: unless-stopped
    depends_on:
      - portal
    volumes:
      # ★ ファイル単体ではなくディレクトリでマウントする。
      #   rsync はファイルを置き換える（inode が変わる）ので、単一ファイルの
      #   バインドマウントだとコンテナが古い中身を見続ける。実際に
      #   「配備したのに設定が反映されない」が起きた。
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
      # Tailscale から HTTPS 証明書を受け取るための LocalAPI ソケット。
      # 証明書の発行には root 権限が要る。Caddy コンテナは root で動くので通る。
      - /var/run/tailscale:/var/run/tailscale:ro
    environment:
      # HTTPS を張る Tailscale MagicDNS 名。
      TS_HOSTNAME: ${TS_HOSTNAME:-s1.tail981a3e.ts.net}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDR:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  portal:
    build: ./portal
    image: s1-portal/portal:local
    container_name: portal-app
    restart: unless-stopped
    volumes:
      # 書き込み可でマウントする。/sensors 画面のトグルが
      # config/switchbot.yml を書き換えるため。
      # サービスの追加も、コンテナを再起動せずに反映される
      # （registry.py が mtime を見る）。
      - ./config:/app/config
      # 温湿度の履歴（SQLite）。書き手はポータルだけ。
      - portal-data:/data
    environment:
      SERVICES_FILE: /app/config/services.yml
      SWITCHBOT_CONFIG: /app/config/switchbot.yml
      SWITCHBOT_EXPORTER_URL: http://portal-switchbot-exporter:9110
      # speed-exporter は host ネットワークで動くのでコンテナ名では引けない。
      # ホストの IP を直接書くと DHCP で変わったときに黙って壊れるので使わない。
      SPEED_EXPORTER_URL: http://host.docker.internal:${SPEED_PORT:-9800}
      HISTORY_DB: /data/history.db
      HISTORY_INTERVAL_SECONDS: ${HISTORY_INTERVAL_SECONDS:-120}
      HISTORY_KEEP_DAYS: ${HISTORY_KEEP_DAYS:-90}
      STATUS_CACHE_SECONDS: ${STATUS_CACHE_SECONDS:-10}
      HEALTH_TIMEOUT_SECONDS: ${HEALTH_TIMEOUT_SECONDS:-3}
    extra_hosts:
      # host ネットワークで動く speed-exporter に到達するため
      - "host.docker.internal:host-gateway"
    networks:
      # 監視対象へコンテナ名で到達するため、両方のネットワークに属する。
      - default
      - network-analyzer
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  switchbot-exporter:
    build: ./switchbot-exporter
    image: s1-portal/switchbot-exporter:local
    container_name: portal-switchbot-exporter
    restart: unless-stopped
    volumes:
      # 除外リスト。毎周期で読み直すので、編集しても再起動は要らない。
      - ./config:/app/config:ro
    environment:
      SWITCHBOT_TOKEN: ${SWITCHBOT_TOKEN:-}
      SWITCHBOT_SECRET: ${SWITCHBOT_SECRET:-}
      # SwitchBot API は 1 日 10,000 回まで。この間隔がそのまま消費量を決める。
      # 消費回数 ≒ (センサー台数 + 1) × 86400 / この値。詳細は .env.example。
      SWITCHBOT_POLL_SECONDS: ${SWITCHBOT_POLL_SECONDS:-600}
    expose:
      - "9110"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9110/metrics', timeout=3).status == 200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

  forgejo:
    image: codeberg.org/forgejo/forgejo:12
    container_name: portal-forgejo
    restart: unless-stopped
    volumes:
      # ★ データは ~/s1.local の外に置く。make deploy が rsync --delete で
      #   配備先を同期するので、中に置くと配備のたびに消える。
      - ${FORGEJO_DATA:-/srv/forgejo}:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      USER_UID: ${FORGEJO_UID:-1000}
      USER_GID: ${FORGEJO_GID:-1000}

      # サブパス配信。Caddy が /git を剥がして渡すので、Forgejo 自身は
      # ルートで動きつつ、生成する URL にだけ /git/ を付ける。
      FORGEJO__server__ROOT_URL: ${FORGEJO_ROOT_URL:-https://s1.tail981a3e.ts.net/git/}
      FORGEJO__server__HTTP_PORT: "3000"

      # SSH は使わない。ホストの 22 番は既存の sshd が使っており、
      # 別ポートを開けるより HTTPS だけで完結させるほうが単純。
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__server__START_SSH_SERVER: "false"

      # 家庭内の 1 インスタンスに RDB を別に立てる必要はない。
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__database__PATH: /data/forgejo.db

      # 初期設定画面を出さない。代わりに **最初に登録した利用者が管理者**になる。
      # 管理者を作ったら .env の FORGEJO_DISABLE_REGISTRATION を true にして
      # `make up` すると、以後は登録を閉じられる。
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: ${FORGEJO_DISABLE_REGISTRATION:-false}
      # 家庭内なので、中身はログインしないと見えないようにしておく。
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: ${FORGEJO_REQUIRE_SIGNIN:-true}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  speed-exporter:
    build: ./speed-exporter
    image: s1-portal/speed-exporter:local
    container_name: portal-speed-exporter
    restart: unless-stopped
    # 有線と無線を測り分けるには、ホストのインターフェースにバインドする
    # 必要がある。ブリッジ上だと既定経路（＝有線）からしか出ていけない。
    network_mode: host
    environment:
      # name:interface を書いた順に測る。最初のものが基準のサーバを決める。
      SPEED_LINKS: ${SPEED_LINKS:-wired:eno1,wifi:wlp3s0}
      # 1 回の測定で数百 MB を流す。頻繁に測ると回線を占有して通信量も食う。
      SPEED_INTERVAL_SECONDS: ${SPEED_INTERVAL_SECONDS:-21600}
      SPEED_PORT: ${SPEED_PORT:-9800}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9800/metrics', timeout=3).status == 200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: portal-node-exporter
    restart: unless-stopped
    # ホスト自身の状態を測るので、ホストの PID 名前空間とルートを見せる。
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|host/(dev|proc|sys|run|var/lib/docker/.+))($$|/)
    expose:
      - "9100"

volumes:
  caddy-data:
  caddy-config:
  portal-data:

networks:
  # 既定のネットワーク。portal / caddy / node-exporter はここで互いに解決できる。
  default:
    name: s1-portal

  # network-analyzer が作ったネットワークに相乗りする。
  # これにより na-prometheus / na-grafana へコンテナ名で到達でき、
  # network-analyzer 側の設定を一切変更せずに済む。
  network-analyzer:
    name: network-analyzer_default
    external: true
