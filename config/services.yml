# ===========================================================================
# s1 で動いているサービスの登録簿。
#
# ★ サービスを追加するときは、このファイルにエントリを 1 つ足すだけでよい。
#   Python コードを触る必要はなく、コンテナの再起動も不要
#   （ファイルの更新時刻を見て自動で読み直す）。
#
# 詳しい書き方は CLAUDE.md を参照。
# ===========================================================================

categories:
  home: 家の状態
  monitoring: 監視
  infra: サーバ基盤
  tools: 自作ツール

services:
  # -------------------------------------------------------------------------
  # 温湿度センサーは 32 台ある。全部をここに並べるとトップページの
  # 一覧性が失われるので、代表的な数点だけを出して /sensors へ誘導する。
  # 代表を入れ替えたいときは device_name を書き換えるだけでよい。
  - id: switchbot
    name: 温湿度センサー
    description: 南棟・北棟・苗場の温湿度。代表を 1 点ずつ出している。全台の一覧とグラフは開いて確認する。
    url: /sensors
    category: home
    health:
      type: http
      url: http://portal-switchbot-exporter:9110/metrics
    # 値を行×列の表に並べる。縦が棟、横が屋外/屋内。
    # 屋内はそれぞれのリビング。
    layout: matrix
    matrix:
      columns: [屋外, 屋内（リビング）]
      rows: [南棟, 北棟, 苗場]

    metrics:
      # row と column でどのマスに置くかを決める。
      # ここに書く device_name は config/switchbot.yml の devices に
      # 載っているもの（＝取得中のもの）に限る。止めたセンサーを指すと
      # 値が「—」のままになる。
      - label: 南棟 屋外
        row: 南棟
        column: 屋外
        source: prometheus_text
        endpoint: http://portal-switchbot-exporter:9110
        metric: switchbot_temperature_celsius
        labels: {device_name: 外の温度計}
        format: celsius
        thresholds: {warn: 30, crit: 35}

      - label: 南棟 リビング
        row: 南棟
        column: 屋内（リビング）
        source: prometheus_text
        endpoint: http://portal-switchbot-exporter:9110
        metric: switchbot_temperature_celsius
        labels: {device_name: リビング温湿度管理}
        format: celsius
        thresholds: {warn: 28, crit: 31}

      - label: 北棟 屋外
        row: 北棟
        column: 屋外
        source: prometheus_text
        endpoint: http://portal-switchbot-exporter:9110
        metric: switchbot_temperature_celsius
        labels: {device_name: 北棟屋外温度計}
        format: celsius
        thresholds: {warn: 30, crit: 35}

      - label: 北棟 リビング
        row: 北棟
        column: 屋内（リビング）
        source: prometheus_text
        endpoint: http://portal-switchbot-exporter:9110
        metric: switchbot_temperature_celsius
        labels: {device_name: 北棟リビング}
        format: celsius
        thresholds: {warn: 28, crit: 31}

      - label: 苗場 屋外
        row: 苗場
        column: 屋外
        source: prometheus_text
        endpoint: http://portal-switchbot-exporter:9110
        metric: switchbot_temperature_celsius
        labels: {device_name: バルコニーの温湿度計}
        format: celsius
        thresholds: {warn: 30, crit: 35}

      - label: 苗場 リビング
        row: 苗場
        column: 屋内（リビング）
        source: prometheus_text
        endpoint: http://portal-switchbot-exporter:9110
        metric: switchbot_temperature_celsius
        labels: {device_name: リビングの温度計}
        format: celsius
        thresholds: {warn: 28, crit: 31}

      - label: 取得できているセンサー
        source: prometheus_text
        endpoint: http://portal-switchbot-exporter:9110
        metric: switchbot_sensor_count
        format: count

      # 電池切れや圏外で値を返さなくなったセンサーの数。
      # config/switchbot.yml で除外したものはここに含まれない。
      - label: 値なしセンサー
        source: prometheus_text
        endpoint: http://portal-switchbot-exporter:9110
        metric: switchbot_offline_device_count
        format: count
        thresholds: {warn: 1, crit: 3}

  # -------------------------------------------------------------------------
  # 有線と無線を同じサーバに対して順番に測っている。差がそのまま
  # 「無線にすると何 Mbps 落ちるか」になる。
  # 1 回の測定で数百 MB 流すので、測るのは 6 時間ごと。
  - id: speed
    name: 回線速度
    description: 有線と無線それぞれのインターネット速度。同じサーバに順番に当てて測っているので、差は経路の違いそのもの。
    url: null
    category: monitoring
    health:
      type: http
      url: http://host.docker.internal:9800/metrics

    layout: matrix
    matrix:
      columns: [下り, 上り, Ping]
      rows: [有線, 無線]

    metrics:
      - label: 有線 下り
        row: 有線
        column: 下り
        source: prometheus_text
        endpoint: http://host.docker.internal:9800
        metric: home_speed_download_bits_per_second
        labels: {link: wired}
        format: mbps

      - label: 有線 上り
        row: 有線
        column: 上り
        source: prometheus_text
        endpoint: http://host.docker.internal:9800
        metric: home_speed_upload_bits_per_second
        labels: {link: wired}
        format: mbps

      - label: 有線 Ping
        row: 有線
        column: Ping
        source: prometheus_text
        endpoint: http://host.docker.internal:9800
        metric: home_speed_ping_milliseconds
        labels: {link: wired}
        format: milliseconds
        thresholds: {warn: 30, crit: 60}

      - label: 無線 下り
        row: 無線
        column: 下り
        source: prometheus_text
        endpoint: http://host.docker.internal:9800
        metric: home_speed_download_bits_per_second
        labels: {link: wifi}
        format: mbps

      - label: 無線 上り
        row: 無線
        column: 上り
        source: prometheus_text
        endpoint: http://host.docker.internal:9800
        metric: home_speed_upload_bits_per_second
        labels: {link: wifi}
        format: mbps

      - label: 無線 Ping
        row: 無線
        column: Ping
        source: prometheus_text
        endpoint: http://host.docker.internal:9800
        metric: home_speed_ping_milliseconds
        labels: {link: wifi}
        format: milliseconds
        thresholds: {warn: 30, crit: 60}

      # 表の下に出る。古い値を今の速度と読み違えないための指標。
      - label: 測ってから
        source: prometheus_text
        endpoint: http://host.docker.internal:9800
        metric: home_speed_age_seconds
        labels: {link: wired}
        format: duration

  # -------------------------------------------------------------------------
  - id: network-analyzer
    name: ネットワーク監視
    description: 宅内 〜 ルーター 〜 ISP 〜 インターネットの区間別に遅延とロスを常時計測している。どの区間が壊れているかの切り分けに使う。
    url: /grafana
    category: monitoring
    health:
      type: http
      # コンテナ名で到達する（network-analyzer_default に相乗りしているため）
      url: http://na-grafana:3000/api/health
    metrics:
      - label: インターネット ロス率
        source: prometheus
        endpoint: http://na-prometheus:9090
        query: 'network:probe_loss:ratio5m_by_layer{layer="internet"}'
        format: percent
        thresholds: {warn: 0.01, crit: 0.05}

      - label: ゲートウェイ RTT
        source: prometheus
        endpoint: http://na-prometheus:9090
        query: 'network:icmp_rtt:p95_5m_by_layer{layer="gateway"}'
        format: seconds_ms
        thresholds: {warn: 0.02, crit: 0.1}

      - label: 発報中アラート
        source: prometheus
        endpoint: http://na-prometheus:9090
        # or vector(0) を付けないと、0 件のときに空の結果になって
        # 「取得失敗」と区別がつかなくなる。
        query: 'count(ALERTS{alertstate="firing"}) or vector(0)'
        format: count
        thresholds: {warn: 1, crit: 1}

  # -------------------------------------------------------------------------
  - id: prometheus
    name: Prometheus
    description: 監視データの収集と保存。PromQL を直接叩きたいときや、ターゲットの取りこぼしを確認したいときに開く。
    url: /prometheus
    category: monitoring
    health:
      type: http
      url: http://na-prometheus:9090/-/healthy
    metrics:
      - label: 収集中の系列数
        source: prometheus
        endpoint: http://na-prometheus:9090
        query: 'prometheus_tsdb_head_series'
        format: count

      - label: 失敗中のターゲット
        source: prometheus
        endpoint: http://na-prometheus:9090
        query: 'count(up == 0) or vector(0)'
        format: count
        thresholds: {warn: 1, crit: 3}

  # -------------------------------------------------------------------------
  - id: s1-host
    name: s1 サーバ
    description: このポータル自身が動いているホスト。何が載っていて、今どうなっているか。
    # 遷移先を持たないサービス。数値カードだけを出す。
    url: null
    category: infra
    health:
      type: http
      url: http://portal-node-exporter:9100/metrics
    metrics:
      # --- スペックと OS -----------------------------------------------
      # OS 名やカーネル版数は値ではなくラベルに入っているので value_from で拾う。
      - label: OS
        source: prometheus_text
        endpoint: http://portal-node-exporter:9100
        metric: node_os_info
        value_from: pretty_name

      - label: カーネル
        source: prometheus_text
        endpoint: http://portal-node-exporter:9100
        metric: node_uname_info
        value_from: release

      - label: アーキテクチャ
        source: prometheus_text
        endpoint: http://portal-node-exporter:9100
        metric: node_uname_info
        value_from: machine

      - label: CPU
        source: node_exporter
        endpoint: http://portal-node-exporter:9100
        field: cpu_cores
        format: count

      - label: メモリ
        source: node_exporter
        endpoint: http://portal-node-exporter:9100
        field: memory_total_bytes
        format: bytes

      - label: ディスク
        source: node_exporter
        endpoint: http://portal-node-exporter:9100
        field: rootfs_total_bytes
        format: bytes

      # --- 今の状態 -----------------------------------------------------
      - label: CPU 使用率
        source: node_exporter
        endpoint: http://portal-node-exporter:9100
        field: cpu_usage_ratio
        format: percent
        thresholds: {warn: 0.8, crit: 0.95}

      - label: メモリ使用率
        source: node_exporter
        endpoint: http://portal-node-exporter:9100
        field: memory_usage_ratio
        format: percent
        thresholds: {warn: 0.85, crit: 0.95}

      - label: ディスク使用率
        source: node_exporter
        endpoint: http://portal-node-exporter:9100
        field: rootfs_usage_ratio
        format: percent
        thresholds: {warn: 0.8, crit: 0.9}

      - label: CPU 温度
        source: node_exporter
        endpoint: http://portal-node-exporter:9100
        field: cpu_temperature_celsius
        format: celsius
        thresholds: {warn: 70, crit: 85}

      - label: 連続稼働
        source: node_exporter
        endpoint: http://portal-node-exporter:9100
        field: uptime_seconds
        format: duration
