# ===========================================================================
# SwitchBot exporter の設定。
#
# ここに書いたデバイスは **API の取得対象から外れる**。状態の問い合わせ自体を
# 行わないので、1 日 10,000 回の呼び出し上限の消費も減る。
#
# 変更後は `make up`（または make deploy）で反映。
# デバイス ID は `make switchbot-devices` で確認できる。
# ===========================================================================

# 照合は id で行う。name は人間が読むためのもので、照合には使わない
