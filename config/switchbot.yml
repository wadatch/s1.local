# ===========================================================================
# SwitchBot exporter の設定。
#
# ★ exclude の部分はポータルの /sensors 画面から更新される。
#   手で書いたコメントは書き戻しの際に失われるので注意。
#   homes と devices は書き戻しでもそのまま持ち越される。
#
# 照合は id で行う。コメントの名前は人間が読むためのもので、照合には使わない
# （SwitchBot アプリで名前を変えても対応づけが外れないようにするため）。
# ===========================================================================

# --- ホームの表示順 --------------------------------------------------------
# SwitchBot API v1.1 は**ホームもルームも返さない**（返るのは deviceId /
# deviceName / deviceType / hubDeviceId / group 系だけ）。hubDeviceId も
# 多くのデバイスで 000000000000 になるため、ハブからの推定も当てにならない。
# そのため対応づけはここで持つしかない。
homes:
  - 南棟
  - 北棟
  - 苗場

# --- デバイスの所属 --------------------------------------------------------
# home（棟）→ area（階・外部など）→ room（部屋）の 3 階層。
# room はエリア直下にセンサーが付いている場合は空でよい。
#
# エリアの表示順は、このファイルに書いた順（そのホームで最初に出てきた順）。
# ここに無いデバイスは「未分類」として最後に出る。
devices:
  # === 南棟 ===============================================================
  F2B200C6217A: {home: 南棟, area: 外部}                    # ベランダ
  D96E7F060E48: {home: 南棟, area: 外部}                    # outdoor
  DE4243346FA3: {home: 南棟, area: 外部}                    # 外の温度計
  D35537C2F423: {home: 南棟, area: 玄関}                    # 玄関 ハブ２
  B0E9FE6E3C36: {home: 南棟, area: 1階}                     # リビング温湿度管理
  CE2A46465F71: {home: 南棟, area: 1階}                     # 床暖房ヘッダーボックス
  DF895FB963F6: {home: 南棟, area: 2階, room: 書斎}         # 書斎の温度計
  B0E9FEC8C19B: {home: 南棟, area: 2階, room: 寝室}         # 寝室のハブ3
  D6FC955EE690: {home: 南棟, area: 2階, room: 佳織の部屋}   # 佳織の部屋ハブ

  # === 北棟 ===============================================================
  E77640862C81: {home: 北棟, area: 外部}                    # 北棟屋外温度計
  B0E9FE9BB613: {home: 北棟, area: 1階, room: リビング}     # 北棟リビング
  B0E9FEF1DE93: {home: 北棟, area: 1階, room: ダイニング}   # ダイニング温湿度パネル
  B0E9FE6ABE9B: {home: 北棟, area: 2階, room: 書斎}         # 北棟書斎CO2
  B0E9FEDB6DA5: {home: 北棟, area: 2階, room: 寝室}         # 北棟寝室温湿度パネル

  # === 苗場 ===============================================================
  C86B83065965: {home: 苗場, area: 外部}                    # バルコニーの温湿度計
  B0E9FE53353E: {home: 苗場, area: リビング}                # リビングの温度計
  C76A02465B25: {home: 苗場, area: WIC}                     # WICの温湿度計
  D53441C64307: {home: 苗場, area: トイレ}                  # トイレ温度計
  C76A02063069: {home: 苗場, area: PS}                      # PSの温湿度計

# --- 取得を止めているデバイス ----------------------------------------------
# ここに書いたものは API の取得対象から外れる。状態の問い合わせ自体を
# 行わないので、1 日 10,000 回の呼び出し上限の消費も減る。
#
# 上の devices に載っていない 13 台。使っていないセンサーを止めることで、
# 取得対象は 32 台 → 19 台になり API の消費もその分減る。
exclude:
  - id: E1CDAEE99F72
    name: 1階ホール(北)
    reason: 使っていないため取得停止
  - id: EA7452161689
    name: 2階ホール(南)
    reason: 使っていないため取得停止（値も返さない）
  - id: B0E9FEA792EF
    name: CO2センサー
    reason: 使っていないため取得停止
  - id: B0E9FE95DE20
    name: ダイニング
    reason: 使っていないため取得停止
  - id: B0E9FE56BD4E
    name: ダイニングの温度計
    reason: 使っていないため取得停止
  - id: C4F563E7C939
    name: リビング
    reason: 使っていないため取得停止（値も返さない）
  - id: F928EEE38016
    name: リビングのハブ
    reason: 使っていないため取得停止
  - id: F616AB5BB744
    name: 佳織の部屋温度計
    reason: 使っていないため取得停止（値も返さない）
  - id: F54EB707F705
    name: 北ダイニング ハブ2
    reason: 使っていないため取得停止
  - id: FB98D7E4D161
    name: 北棟ダイニングの温度計
    reason: 使っていないため取得停止
  - id: FA9779150A64
    name: 南棟和室温度計
    reason: 使っていないため取得停止（値も返さない）
  - id: B0E9FED8AF2C
    name: 寝室CO2
    reason: 使っていないため取得停止
  - id: EFBF3CCA9E84
    name: 寝室温度計
    reason: 使っていないため取得停止（値も返さない）
